# Integrated_content_OS Workflow Dependency Update Across Multiple Packages

## Action

Follow the dependency-update-across-multiple-packages workflow:
1. Detect outdated dependencies in multiple package.json files.
2. Update the version(s) of the dependency in each relevant package.json.
3. Update the corresponding package-lock.json files.
4. Commit all changed package.json and package-lock.json files together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: **/package.json, **/package-lock.json

